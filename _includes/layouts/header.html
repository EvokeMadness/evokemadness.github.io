<header>
  <div class="header-row">
    <a href="/">
      <h1 style="font-weight: normal;">
        {{ metadata.author.username }}
      </h1>
    </a>
    <div>
      {% for link in metadata.author.links %}
      <a href="{{ link.link }}">
        <i class="{{ link.icon }}" style="font-size: 36px;"></i>
      </a>
      {% endfor %}
    </div>
  </div>
</header>
