<script>
  (async function () {
    var projectUrl = "https://github.com/EvokeMadness/note-cards";
    var readmeElement = document.querySelector(".README");

    var rawUrl = projectUrl.replace("github.com", "raw.githubusercontent.com");
    var readmeUrl = rawUrl.replace("/refs/heads", "/") + "/main/README.md";

    var response = await fetch(readmeUrl);
    if (!response.ok) {
      var readmeUrl = rawUrl.replace("/refs/heads", "/") + "/master/README.md";
      response = await fetch(readmeUrl);
    }
    if (!response.ok) {
      var readmeUrl = rawUrl.replace("/tree", "/") + "/README.md";
      response = await fetch(readmeUrl);
    }
    if (!response.ok) return;

    var blobBase =
      projectUrl.replace(/\/$/, "") +
      (readmeUrl.includes("/master/") ? "/blob/master/" : "/blob/main/");

    var readme = await response.text(readmeUrl);

    var reader = new commonmark.Parser();
    var writer = new commonmark.HtmlRenderer({ safe: true });
    var parsed = reader.parse(readme);

    var walker = parsed.walker();
    var event, node;
    var displayPreviews = "true";

    while ((event = walker.next())) {
      node = event.node;
      if (event.entering) {
        if (
          node.type === "image" &&
          displayPreviews === "true"
        ) {
          if (node.destination.includes("/blob/")) {
            node.destination =
              node.destination +
              (node.destination.includes("?") ? "&raw=true" : "?raw=true");
          } else if (
            !node.destination.startsWith("http://") &&
            !node.destination.startsWith("https://") &&
            !node.destination.startsWith("//") &&
            !node.destination.startsWith("data:")
          ) {
            try {
              node.destination = new URL(node.destination, readmeUrl).href;
            } catch (e) {}
          }
        } else if (
          (node.type === "html_block" || node.type === "html_inline") &&
          displayPreviews === "true"
        ) {
          if (node.literal && node.literal.includes("<img")) {
            node.literal = node.literal.replace(
              /src=["']([^"']+)["']/gi,
              function (match, src) {
                if (src.includes("/blob/"))
                  return (
                    'src="' +
                    src +
                    (src.includes("?") ? "&raw=true" : "?raw=true") +
                    '"'
                  );
                if (
                  !src.startsWith("http://") &&
                  !src.startsWith("https://") &&
                  !src.startsWith("//") &&
                  !src.startsWith("data:")
                ) {
                  try {
                    return 'src="' + new URL(src, readmeUrl).href + '"';
                  } catch (e) {}
                }
                return match;
              }
            );
          }
        } else if (node.type === "link") {
          if (
            node.destination &&
            !node.destination.startsWith("#") &&
            !node.destination.startsWith("http://") &&
            !node.destination.startsWith("https://") &&
            !node.destination.startsWith("//") &&
            !node.destination.startsWith("mailto:") &&
            !node.destination.startsWith("tel:")
          ) {
            try {
              var resolved = new URL(node.destination, blobBase);
              if (resolved.origin === new URL(blobBase).origin) {
                node.destination = resolved.href;
              }
            } catch (e) {}
          }
        }
      }
    }
    var result = writer.render(parsed);
    readmeElement.innerHTML = result;
  })();
</script>

<script type="module">
  var url = "https://raw.githubusercontent.com/EvokeMadness/note-cards/main/beam-axle-ruler.pdf";

  var { pdfjsLib } = globalThis;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://unpkg.com/pdfjs-dist@5.4.530/build/pdf.worker.min.mjs";

  var pdfDoc = null,
    pageNum = 1,
    pageRendering = false,
    pageNumPending = null,
    scale = 1,
    canvas = document.getElementById("the-canvas"),
    ctx = canvas.getContext("2d");

  function renderPage(num) {
    pageRendering = true;
    pdfDoc.getPage(num).then(function (page) {
      var viewport = page.getViewport({ scale: scale });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      var renderContext = {
        canvasContext: ctx,
        viewport: viewport,
      };
      var renderTask = page.render(renderContext);

      renderTask.promise.then(function () {
        pageRendering = false;
        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      });
    });

    document.getElementById("page_num").textContent = num;

    var nav = document.querySelector(".navigation");
    if (pdfDoc.numPages <= 1) {
      if (nav) nav.style.display = "none";
    } else {
      if (nav) nav.style.display = "";
      document.getElementById("prev").style.visibility =
        num <= 1 ? "hidden" : "visible";
      document.getElementById("next").style.visibility =
        num >= pdfDoc.numPages ? "hidden" : "visible";
    }
  }

  function queueRenderPage(num) {
    if (pageRendering) {
      pageNumPending = num;
    } else {
      renderPage(num);
    }
  }

  function onPrevPage() {
    if (pageNum <= 1) {
      return;
    }
    pageNum--;
    queueRenderPage(pageNum);
  }
  document.getElementById("prev").addEventListener("click", onPrevPage);

  function onNextPage() {
    if (pageNum >= pdfDoc.numPages) {
      return;
    }
    pageNum++;
    queueRenderPage(pageNum);
  }
  document.getElementById("next").addEventListener("click", onNextPage);

  pdfjsLib.getDocument(url).promise.then(function (pdfDoc_) {
    pdfDoc = pdfDoc_;
    document.getElementById("page_count").textContent = pdfDoc.numPages;

    renderPage(pageNum);
  });
</script>
